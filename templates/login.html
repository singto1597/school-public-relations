<!DOCTYPE html>
<html>
<head>
    <title>Teacher Login</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body style="display:flex; justify-content:center; align-items:center; height:100vh;">
    <div class="card" style="width: 300px;">
        <h2>🔐 เข้าสู่ระบบครู</h2>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <p style="color:red">{{ messages[0] }}</p>
            {% endif %}
        {% endwith %}
        <form method="POST">
            <input type="text" name="username" placeholder="Username" required style="width:90%; padding:10px; margin:10px 0;"><br>
            <input type="password" name="password" placeholder="Password" required style="width:90%; padding:10px; margin:10px 0;"><br>
            <button type="submit" style="width:100%; padding:10px; background:#2563eb; color:white; border:none; border-radius:5px; cursor:pointer;">Login</button>
        </form>
    </div>
</body>
</html>
