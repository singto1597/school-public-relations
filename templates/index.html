<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Pulse</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <header>
            <h1>School Public Relations 🏫</h1>
            <div id="date-display">loading...</div>
        </header>

        <div class="card status-card" id="status-box">
            <div class="label">จุดเข้าแถว</div>
            <div class="value" id="assembly-point">...</div>
        </div>

        <div class="card countdown-card">
            <div class="label">กำลังเรียน: <span id="current-period-name">...</span></div>
            <div class="timer" id="countdown-timer">--:--</div>
            <div class="sub-label" id="next-period-label">คาบต่อไป: ...</div>
        </div>

        <div class="card announcement-card" id="announcement-box" style="display: none;">
            <div class="label">📢 ประกาศด่วน</div>
            <div class="msg" id="special-message"></div>
        </div>
        
        <div id="news-feed" style="margin-top: 20px;"></div>

        <div class="schedule-list">
            <h3>ตารางเวลาวันนี้</h3>
            <ul id="timeline-list">
                </ul>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
